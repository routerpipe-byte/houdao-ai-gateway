name: Tesla Model Y 现车提醒

on:
  schedule:
    # Every 10 minutes, offset from round tens to reduce scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/tesla-monitor/monitor.py"
      - ".github/tesla-monitor/runner.py"
      - ".github/tesla-monitor/requirements.txt"
      - ".github/workflows/tesla-model-y-inventory-alert.yml"
  pull_request:
    paths:
      - ".github/tesla-monitor/**"
      - ".github/workflows/tesla-model-y-inventory-alert.yml"

concurrency:
  group: tesla-model-y-inventory-alert
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check-spain-model-y:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/tesla-monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r .github/tesla-monitor/requirements.txt

      - name: Check Spain Model Y inventory
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESLA_ALERT_ASSIGNEE: routerpipe-byte
          TESLA_STATE_PATH: .github/tesla-monitor/state.json
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: python .github/tesla-monitor/runner.py

      - name: Persist inventory state
        if: ${{ github.event_name != 'pull_request' && steps.monitor.outputs.state_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tesla-monitor/state.json
          git commit -m "chore: update Tesla Model Y inventory state [skip ci]"
          git push

      - name: Report result
        run: |
          echo "Current inventory: ${{ steps.monitor.outputs.current_count }}"
          echo "New vehicles: ${{ steps.monitor.outputs.new_count }}"
          echo "Alert created: ${{ steps.monitor.outputs.alert_created }}"
